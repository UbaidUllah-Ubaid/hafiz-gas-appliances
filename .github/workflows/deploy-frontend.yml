name: Deploy Angular frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ecommerce-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ecommerce-frontend
        run: npm ci

      - name: Build Angular app
        working-directory: ecommerce-frontend
        run: npm run build -- --base-href /hafiz-gas-appliances-backend/

      - name: Configure GitHub Pages fallback
        run: cp ecommerce-frontend/dist/ecommerce-frontend/browser/index.html ecommerce-frontend/dist/ecommerce-frontend/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ecommerce-frontend/dist/ecommerce-frontend/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
