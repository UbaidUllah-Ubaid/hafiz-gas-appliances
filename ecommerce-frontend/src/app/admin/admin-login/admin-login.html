<div class="login-container">
  <div class="login-card">

    <div class="brand-section">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M26 4C28 14 17 16 17 25C17 29 20 32 24 32C30 32 34 27 32 20C39 26 40 32 37 38C34 44 27 46 21 44C12 42 7 35 9 27C10 19 17 13 26 4Z"
            fill="currentColor"/>
          <path d="M25 27C27 32 22 34 22 38C22 40 24 41 26 40C30 38 29 33 25 27Z"
            fill="#20252B"/>
        </svg>
      </div>

      <span class="brand-eyebrow">ADMINISTRATION PORTAL</span>
      <h1>HAFIZ <span>GAS</span></h1>
      <p class="brand-subtitle">APPLIANCES</p>
      <div class="brand-line"></div>
      <p class="brand-description">
        Secure access to your business dashboard.
      </p>
    </div>

    <div class="form-section">
      <div class="form-heading">
        <span class="section-label">CONTROL PANEL</span>
        <h2>Welcome back</h2>
        <p>Sign in to manage your store.</p>
      </div>

      <form class="login-form" (ngSubmit)="login()">
        <div class="form-field">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"
                stroke="currentColor" stroke-width="1.6"/>
              <path d="m4 7 8 6 8-6"
                stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input
              id="email"
              type="email"
              name="email"
              [(ngModel)]="email"
              placeholder="Enter admin email"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="5" y="10" width="14" height="11" rx="2"
                stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"
                stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round"/>
              <circle cx="12" cy="15" r="1.3" fill="currentColor"/>
            </svg>
            <input
              id="password"
              type="password"
              name="password"
              [(ngModel)]="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
          </div>
        </div>

        @if (loginError) {
          <div class="login-error" role="alert">
            <span class="error-symbol">!</span>
            <span>{{ loginError }}</span>
          </div>
        }

        @if (errorMessage) {
          <div class="error-message" role="alert">
            <span class="error-symbol">!</span>
            <span>{{ errorMessage }}</span>
          </div>
        }

        <button class="login-button" type="submit" [disabled]="loading">
          @if (loading) {
            <span class="button-content">
              <span class="spinner"></span>
              Signing in...
            </span>
          } @else {
            <span class="button-content">
              Sign in to dashboard
              <span class="button-arrow">→</span>
            </span>
          }
        </button>

        <div class="security-note">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3 19 6v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3Z"
              stroke="currentColor" stroke-width="1.6"
              stroke-linejoin="round"/>
            <path d="m9 12 2 2 4-4"
              stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Authorized administrators only</span>
        </div>
      </form>
    </div>

    <footer class="login-footer">
      <span>HAFIZ GAS APPLIANCES</span>
      <span>ADMIN PORTAL</span>
    </footer>

  </div>
</div>
